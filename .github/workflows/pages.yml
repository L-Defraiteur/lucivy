name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The playground is static: the WASM build is committed under
      # playground/pkg, and the demo index is cloned from GitHub and built in
      # the visitor's browser — nothing to build here any more (the old
      # dataset.luce step shipped 67 MB nobody loaded).

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
