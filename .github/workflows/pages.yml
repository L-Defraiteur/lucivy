name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The playground is static: the WASM build is committed under
      # playground/pkg, and the demo index is cloned from GitHub and built in
      # the visitor's browser — nothing to build here any more (the old
      # dataset.luce step shipped 67 MB nobody loaded).

      # What the demo indexes: the text files of this very commit, as a
      # tarball next to the page — same origin, no GitHub API, no quota, and
      # exact to the commit (its short SHA is the tarball's top directory,
      # the terminal shows it). Never committed.
      - name: Bundle the source for the demo
        run: |
          git ls-files -z \
            | grep -zEv '\.(wasm|node|tar\.gz|tgz|luce|png|jpg|jpeg|gif|ico|woff2?|pdf)$' \
            | tar --null -T - --transform "s,^,lucivy-${GITHUB_SHA::7}/," -czf playground/lucivy-source.tar.gz
          ls -la playground/lucivy-source.tar.gz

      # The corpora the terminal indexes on demand (`index mdn`, `index linux`,
      # …): named in playground/corpora.json, built here from their sources
      # with the page's own filter (text files of 100 KB at most), never
      # committed. A visitor downloads only the one they type.
      - name: Build the corpora
        run: |
          python3 playground/tools/build_corpus.py all
          ls -la playground/corpus-*.tar.gz

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
