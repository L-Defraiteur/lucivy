name: CI

# Is the code right: every push on main and on a release branch (`v4.1`…),
# every pull request to main, and called by release.yml before it publishes —
# the gate of a release is this file itself, not a copy of it.
on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        features:
          - label: "default"
            flags: "mmap,stopwords,lz4-compression"
          - label: "all"
            flags: "mmap,stopwords,lz4-compression,zstd-compression,failpoints"
          - label: "minimal"
            flags: ""

    name: test-${{ matrix.features.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          if [ -z "${{ matrix.features.flags }}" ]; then
            cargo build --lib --no-default-features
          else
            cargo build --features ${{ matrix.features.flags }} --no-default-features
          fi

      - name: Run lib tests
        run: |
          if [ -z "${{ matrix.features.flags }}" ]; then
            cargo test --lib --no-default-features
          else
            cargo test --lib --features ${{ matrix.features.flags }} --no-default-features
          fi

  clippy:
    runs-on: ubuntu-latest
    name: clippy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (default features)
        run: cargo clippy --lib -- -D warnings
      # The engine was the only crate linted, so the crates written on top of
      # it never were. The vendored forks (lucivy-fst, bitpacker, columnar…)
      # stay out: their lint debt is tantivy's, not ours.
      - name: Clippy (the crates we write)
        run: cargo clippy -p lucivy-core -p lucistore -p luciole -p sparse-vector --lib -- -D warnings

  # The core's own suite: the option matrix (v3, shared dictionary,
  # derived_in_ram, positions: false), the 3.0.8 fixture, filtered and
  # federated search, the blob store… — and the C++ binding's Rust tests.
  # Until 4.1 only the release ran it, at the tag.
  core:
    runs-on: ubuntu-latest
    name: lucivy-core and lucivy-cpp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: lucivy-core
        run: cargo test -p lucivy-core --no-fail-fast
      - name: lucivy-cpp
        run: cargo test -p lucivy-cpp

  # Ground truth on the repository's own source: every count and every span
  # of a fixed panel (strict, relaxed, fuzzy, regex) compared with a byte-level
  # grep. No timing is asserted — shared runners cannot measure that — only
  # the answers.
  ground-truth:
    runs-on: ubuntu-latest
    name: ground-truth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Substring, fuzzy and regex answers against grep
        env:
          V3_CORPUS: .
          V3_MAX_DOCS: "1500"
          V3_INDEX_DIR: /tmp/v3idx_ci_repo
          V3_QUERIES: 'ShardedHandle:strict,wait_merges_quiet:strict,rag3weaver:relax,spin_lock_init:relax,LucivyError:strict,kmaloc:fz1,ShardedHandel:fz1,Sharded[A-Z]\w+:rx,fn [a-z_]+_v3:rx'
        run: |
          cargo test --release -p lucivy-core --test test_sfx_v3_ground_truth v3_ground_truth_contains -- --nocapture 2>&1 | tee /tmp/gt.txt
          grep -qE "test result: ok" /tmp/gt.txt
          ! grep -qE "MISMATCH|FAIL" /tmp/gt.txt

  thread-spawn-audit:
    runs-on: ubuntu-latest
    name: thread-spawn-audit

    steps:
      - uses: actions/checkout@v4

      - name: Check for unguarded thread::spawn in non-test code
        run: |
          # Find thread::spawn outside of #[cfg(test)] blocks and scheduler.rs
          # Allowed: luciole/src/scheduler.rs (the scheduler itself spawns threads)
          #          #[cfg(test)] blocks
          VIOLATIONS=$(grep -rn "thread::spawn\|thread::Builder" src/ lucivy_core/src/ bindings/ \
            --include="*.rs" \
            | grep -v "#\[cfg(test)\]" \
            | grep -v "// WASM-safe" \
            | grep -v "test.rs:" \
            | grep -v "tests::" \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::Found thread::spawn usage that may break WASM:"
            echo "$VIOLATIONS"
            echo ""
            echo "All threading must go through luciole scheduler (actors/tasks)."
            echo "Use #[cfg(not(target_arch = \"wasm32\"))] if native-only."
          fi

  # The binding's own test suite (pytest), on the wheel built in place.
  lucivy-python:
    runs-on: ubuntu-latest
    name: lucivy-python

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin and pytest
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest

      - name: Build lucivy
        run: |
          . .venv/bin/activate
          cd bindings/python && maturin develop --release

      - name: Test lucivy
        run: |
          . .venv/bin/activate
          cd bindings/python && python -m pytest tests -q

  # Every Node test file, on the addon built in place.
  lucivy-nodejs:
    runs-on: ubuntu-latest
    name: lucivy-nodejs

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build lucivy-napi
        run: cargo build -p lucivy-napi --release

      - name: Prepare .node binary
        run: |
          cp target/release/liblucivy_napi.so bindings/nodejs/lucivy.node

      - name: Test lucivy-nodejs
        run: |
          cd bindings/nodejs
          node test.mjs
          for t in tests/v3_api.mjs tests/positions.mjs tests/shared_dictionary.mjs \
                   tests/derived_in_ram.mjs tests/blob_store.mjs; do
            echo "── $t"
            node "$t"
          done
          node tests/smoke_warnings.mjs "$PWD/lucivy.node"

  lucivy-cpp:
    runs-on: ubuntu-latest
    name: lucivy-cpp

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build lucivy-cpp
        run: cargo build -p lucivy-cpp --release

      - name: Compile test
        run: |
          INCLUDE_DIR=$(find target/release/build -path "*/lucivy-cpp-*/out/cxxbridge/include" -type d | head -1)
          echo "Include dir: $INCLUDE_DIR"
          ls -la "$INCLUDE_DIR/lucivy-cpp/src/" || true
          g++ -std=c++17 -o /tmp/test_lucivy_cpp bindings/cpp/test.cpp \
            -I "$INCLUDE_DIR" -I bindings/cpp/include \
            -L target/release -llucivy_cpp \
            -lpthread -ldl -lm

      - name: Test lucivy-cpp
        run: /tmp/test_lucivy_cpp
