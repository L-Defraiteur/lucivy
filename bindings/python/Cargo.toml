[package]
name = "lucivy"
version = "3.0.0"
edition = "2024"
license = "MIT"
description = "Fast BM25 full-text search index for Python, powered by Lucivy"

[lib]
name = "lucivy"
crate-type = ["cdylib"]

[dependencies]
lucivy-core = { path = "../../lucivy_core" }
ld-lucivy = { path = "../..", default-features = false, features = [
    "stopwords",
    "lz4-compression",
] }
lucistore = { path = "../../lucistore" }
# abi3-py39: one wheel for every CPython >= 3.9 (the stable ABI), instead of
# one per interpreter version — and the build no longer depends on the
# machine's Python matching pyo3's supported range.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
